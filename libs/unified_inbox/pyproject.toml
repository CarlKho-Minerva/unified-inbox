[project]
name = "unified-inbox"
version = "0.1.0"
description = "Unified inbox across email, Slack, and Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "litellm>=1.0",
    "telethon>=1.40",
    "anyjev>=0.0.2",
    "transformers>=4.40",
]

[project.scripts]
unified-inbox = "unified_inbox.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_inbox"]
