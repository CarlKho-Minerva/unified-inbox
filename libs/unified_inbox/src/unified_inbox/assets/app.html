<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unified Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-list: #ffffff;
    --ink: #16161a;
    --ink-2: #5c5f66;
    --ink-3: #9498a1;
    --line: #ececec;
    --line-2: #e3e3e3;
    --accent: #5b53e0;         /* refined indigo */
    --accent-soft: #efeefc;
    --sel: #f5f4ff;
    --unread: #5b53e0;
    --radius: 10px;
    --font: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 13.5px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.006em;
  }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0; }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 52px; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .wordmark { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14.5px; letter-spacing: -0.02em; white-space: nowrap; }
  .modeseg { display: flex; background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: 9px; padding: 2px; gap: 2px; }
  .seg { border: none; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .seg.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .wm-dots { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .wm-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .search {
    flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px;
    background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: 9px;
    padding: 7px 11px; color: var(--ink-3); transition: border-color .12s, background .12s;
  }
  .search:focus-within { border-color: var(--accent); background: #fff; }
  .search input { border: none; outline: none; background: none; width: 100%; font-family: inherit; font-size: 13px; color: var(--ink); }
  .search kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; background: #fff; }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
  .dotpulse { width: 7px; height: 7px; border-radius: 50%; background: #cfcfcf; }
  .dotpulse.on { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .icon-btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); border-radius: 8px; height: 30px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .icon-btn:hover { border-color: var(--ink-3); color: var(--ink); }

  /* ---------- Filter pills ---------- */
  .pills { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--bg); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--ink-3); }
  .pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pill .n { font-family: var(--mono); font-size: 10px; opacity: .8; }
  .pill.sep { border: none; background: none; color: var(--line-2); cursor: default; padding: 0 2px; }

  /* ---------- Main split ---------- */
  .main { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; height: calc(100vh - 52px - 47px); }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } .reader.empty { display: none; } }

  .list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-list); }
  .row { display: grid; grid-template-columns: 3px 1fr auto; gap: 11px; padding: 11px 15px 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--bg-soft); }
  .row.sel { background: var(--sel); }
  .row.sel .bar { background: var(--accent); }
  .bar { border-radius: 0 2px 2px 0; background: transparent; }
  .row .c { min-width: 0; }
  .row .top { display: flex; align-items: center; gap: 7px; }
  .srcdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .who { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.read .who { font-weight: 500; color: var(--ink-2); }
  .tag { font-family: var(--mono); font-size: 9.5px; letter-spacing: .02em; padding: 1px 5px; border-radius: 4px; flex: none; }
  .subj { color: var(--ink); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .row.read .subj { font-weight: 400; color: var(--ink-2); }
  .snip { color: var(--ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
  .row .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 2px 15px 0 0; }
  .row .time { color: var(--ink-3); }
  .udot { width: 7px; height: 7px; border-radius: 50%; background: var(--unread); }
  .row.read .udot { background: transparent; }
  .row.deep { background: linear-gradient(90deg, #faf9ff, #fff); }
  .row.deep.sel { background: var(--sel); }
  .deep-divider { padding: 10px 15px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--bg-soft); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .ext-tag { font-size: 9.5px; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; }
  .deep-btn { margin: 10px 15px; padding: 11px 14px; text-align: center; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--accent); font-size: 13px; cursor: pointer; font-weight: 500; }
  .deep-btn:hover { border-color: var(--accent); background: var(--sel); }
  .deep-btn.loading-inline { color: var(--ink-3); cursor: default; border-style: solid; }

  /* ---------- Calendar agenda ---------- */
  .daygroup { padding: 0; }
  .dayhead { position: sticky; top: 0; background: var(--bg-list); padding: 12px 15px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); border-bottom: 1px solid var(--line); z-index: 1; }
  .dayhead.today { color: var(--accent); }
  .ev { display: grid; grid-template-columns: 3px 54px 1fr; gap: 11px; padding: 10px 15px 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
  .ev:hover { background: var(--bg-soft); }
  .ev.sel { background: var(--sel); }
  .ev.sel .ebar { background: var(--accent); }
  .ebar { border-radius: 0 2px 2px 0; background: transparent; align-self: stretch; }
  .etime { font-family: var(--mono); font-size: 11px; color: var(--ink-2); padding-top: 2px; text-align: right; }
  .etime .allday { color: var(--ink-3); }
  .etitle { font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .emeta { display: flex; align-items: center; gap: 6px; margin-top: 2px; color: var(--ink-3); font-size: 12px; }
  .ecal { display: inline-flex; align-items: center; gap: 5px; }
  .ecaldot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* ---------- Calendar grid (week / 3-day) ---------- */
  .main.cal { grid-template-columns: 1fr 360px; }   /* wide grid + detail panel */
  .calv { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .cal-tip { position: fixed; z-index: 60; background: #16161a; color: #fff; padding: 7px 10px; border-radius: 8px; font-size: 12px; max-width: 260px; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,.25); display: none; line-height: 1.35; }
  .cal-tip .tt { font-weight: 600; margin-bottom: 2px; }
  .cal-tip .ts { opacity: .8; font-size: 11px; }
  .cal-event.sel { outline: 2px solid #16161a; outline-offset: -1px; }
  .cal-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); border-radius: 8px; height: 30px; min-width: 30px; padding: 0 10px; cursor: pointer; font-size: 12.5px; }
  .cal-btn:hover { border-color: var(--ink-3); color: var(--ink); }
  .cal-btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cal-range { font-weight: 600; font-size: 14px; margin-left: 6px; }
  .cal-legend { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--ink-2); max-width: 46%; overflow: hidden; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .cal-legend i { width: 9px; height: 9px; border-radius: 3px; }
  .cal-head { display: grid; border-bottom: 1px solid var(--line); flex: none; }
  .cal-corner { border-right: 1px solid var(--line); }
  .cal-dh { text-align: center; padding: 7px 4px; border-left: 1px solid var(--line-soft); }
  .cal-dh .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
  .cal-dh .dnum { font-size: 19px; font-weight: 600; margin-top: 2px; line-height: 1; }
  .cal-dh.today .dnum { color: #fff; background: var(--accent); border-radius: 999px; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .cal-dh.today .dow { color: var(--accent); }
  .cal-allday { display: grid; border-bottom: 1px solid var(--line); max-height: 108px; overflow-y: auto; flex: none; padding: 3px 0; gap: 2px 0; align-content: start; }
  .cal-allday-label { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 10px; color: var(--ink-3); }
  .cal-abar { margin: 0 3px; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #fff; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 16px; }
  .cal-abar:hover { filter: brightness(1.08); }
  .cal-chip { border-radius: 4px; padding: 2px 6px; font-size: 11px; color: #fff; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-body { flex: 1; overflow-y: auto; }
  .cal-grid { display: grid; position: relative; }
  .cal-axis { position: relative; }
  .cal-axis .hr { position: absolute; right: 6px; font-size: 10px; color: var(--ink-3); transform: translateY(-6px); }
  .cal-col { position: relative; border-left: 1px solid var(--line-soft); }
  .cal-event { position: absolute; border-radius: 5px; padding: 2px 6px; font-size: 11px; color: #fff; overflow: hidden; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.12); line-height: 1.25; }
  .cal-event .ce-t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-event .ce-time { opacity: .85; font-size: 10px; }
  .cal-now { position: absolute; height: 0; border-top: 2px solid #e0533d; z-index: 5; pointer-events: none; }
  .cal-now::before { content: ""; position: absolute; left: -4px; top: -4px; width: 7px; height: 7px; border-radius: 50%; background: #e0533d; }

  /* ---------- Luma SF cards ---------- */
  .luma-wrap { overflow-y: auto; padding: 16px; }
  .luma-day { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 14px 4px 8px; }
  .luma-day.today { color: var(--accent); }
  .luma-card { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; cursor: pointer; background: #fff; text-decoration: none; color: inherit; }
  .luma-card:hover { border-color: var(--ink-3); box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .luma-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .luma-cover { width: 84px; height: 84px; border-radius: 8px; object-fit: cover; background: var(--bg-soft); flex: none; }
  .luma-body { min-width: 0; align-self: center; }
  .luma-time { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 500; }
  .luma-name { font-weight: 600; font-size: 14px; margin: 3px 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .luma-loc { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
  .luma-pills { display: flex; gap: 6px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .luma-pill { border: 1px solid var(--line-2); background: #fff; color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; }
  .luma-pill:hover { border-color: var(--ink-3); }
  .luma-pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .luma-pill .n { font-family: var(--mono); font-size: 10px; opacity: .8; }
  .luma-badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 5px; margin-left: 7px; }
  .luma-detail { overflow-y: auto; height: 100%; }
  .luma-detail-cover { width: 100%; max-height: 240px; object-fit: cover; display: block; background: var(--bg-soft); }
  .luma-detail-body { padding: 20px 24px 30px; }
  .luma-detail-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #e0533d; margin-bottom: 10px; }
  .luma-detail-row { color: var(--ink-2); font-size: 13px; margin: 6px 0; }
  .luma-open { display: inline-block; margin: 14px 0 4px; background: #e0533d; color: #fff; text-decoration: none; padding: 9px 15px; border-radius: 9px; font-weight: 600; font-size: 13px; }
  .luma-open:hover { filter: brightness(1.05); }
  .luma-desc { margin-top: 14px; line-height: 1.55; color: #24242a; font-size: 13px; }
  .luma-desc .ldim { color: var(--ink-3); }
  .luma-prose { margin-top: 14px; line-height: 1.6; color: #24242a; font-size: 13.5px; }
  .luma-prose h3, .luma-prose h4, .luma-prose h5 { margin: 16px 0 6px; font-weight: 700; line-height: 1.3; }
  .luma-prose h3 { font-size: 16px; } .luma-prose h4 { font-size: 14px; } .luma-prose h5 { font-size: 13px; }
  .luma-prose p { margin: 8px 0; }
  .luma-prose ul, .luma-prose ol { margin: 8px 0; padding-left: 22px; }
  .luma-prose li { margin: 3px 0; }
  .luma-prose a { color: #e0533d; text-decoration: underline; }
  .luma-prose blockquote { margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--line-2); color: var(--ink-2); }
  .luma-prose img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
  .luma-prose hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

  /* ---------- Tasks (Obsidian vault) ---------- */
  .task-group { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 14px 15px 6px; }
  .task-row { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 9px 15px; border-bottom: 1px solid var(--line-soft); cursor: pointer; align-items: start; }
  .task-row:hover { background: var(--bg-soft); }
  .task-row.sel { background: var(--sel); }
  .task-box { width: 15px; height: 15px; border: 1.5px solid var(--ink-3); border-radius: 4px; margin-top: 1px; }
  .task-text { color: var(--ink); font-size: 13.5px; line-height: 1.45; }
  .task-meta { display: flex; gap: 8px; margin-top: 4px; }
  .task-due { font-size: 11px; color: var(--ink-3); }
  .task-due.overdue { color: #e0533d; font-weight: 600; }
  .task-tag { font-size: 11px; color: var(--accent); }
  /* Obsidian-style graph in the Tasks right panel */
  .graph-wrap { position: relative; height: 100%; width: 100%; background: #0f1216; overflow: hidden; }
  #graphCanvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #graphCanvas:active { cursor: grabbing; }
  .graph-head { position: absolute; top: 12px; left: 14px; z-index: 2; color: #e9e7e1; font-size: 12px; opacity: .85; }
  .graph-head b { font-weight: 600; }
  .graph-rebuild { margin-left: 8px; color: #9aa5b1; cursor: pointer; text-decoration: none; border-bottom: 1px dotted #4a5568; }
  .graph-rebuild:hover { color: #e9e7e1; }
  .graph-rebuild.busy { color: #f2b45f; cursor: default; border-bottom-color: transparent; opacity: .8; }
  .graph-hint { display: block; margin-top: 3px; color: #6b7688; font-size: 10.5px; letter-spacing: .01em; }
  .graph-tip { position: absolute; z-index: 3; background: #1b212a; color: #e9e7e1; border: 1px solid #2b333f; border-radius: 7px; padding: 5px 9px; font-size: 12px; pointer-events: none; display: none; max-width: 260px; }
  .graph-building { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa5b1; font-size: 13px; }

  /* ---------- Ask (chat) ---------- */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; }
  .chat-empty { margin: auto; text-align: center; color: var(--ink-3); max-width: 380px; }
  .chat-b { max-width: 82%; padding: 11px 15px; border-radius: 15px; line-height: 1.5; white-space: pre-wrap; font-size: 13.5px; }
  .chat-b.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .chat-b.assistant { align-self: flex-start; background: var(--bg-soft); border: 1px solid var(--line); color: var(--ink); }
  .chat-b.thinking { color: var(--ink-3); font-style: italic; }
  .chat-input-row { border-top: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; background: var(--bg); }
  .chat-input-row textarea { flex: 1; resize: none; border: 1px solid var(--line-2); border-radius: 11px; padding: 11px 14px; font-family: inherit; font-size: 13.5px; outline: none; max-height: 140px; line-height: 1.4; }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .chat-send { border: none; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 16px; height: 40px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .chat-send:disabled { opacity: .5; cursor: default; }
  .suggest { padding: 16px; }
  .suggest-h { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 6px 4px 10px; }
  .suggest-item { padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 9px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .suggest-item:hover { border-color: var(--accent); background: var(--sel); }

  /* ---------- Floating Ask agent ---------- */
  .ask-fab { position: fixed; right: 22px; bottom: 22px; z-index: 40; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 20px rgba(91,83,224,.4); }
  .ask-fab:hover { filter: brightness(1.06); }
  .ask-fab.hidden { display: none; }
  .ask-float { position: fixed; right: 22px; bottom: 22px; z-index: 41; width: 400px; max-width: calc(100vw - 32px); height: 600px; max-height: calc(100vh - 90px); background: #fff; border: 1px solid var(--line-2); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.25); display: none; flex-direction: column; overflow: hidden; }
  .ask-float.on { display: flex; }
  .ask-float-head { display: flex; align-items: center; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .ask-float-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .ask-dot { width: 8px; height: 8px; border-radius: 50%; background: #12a150; box-shadow: 0 0 0 3px #12a15022; }
  .ask-float-close { margin-left: auto; border: none; background: none; font-size: 22px; line-height: 1; color: var(--ink-3); cursor: pointer; padding: 0 4px; }
  .ask-float-close:hover { color: var(--ink); }
  .ask-float .chat-empty { font-size: 13px; }
  .ask-suggest { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
  .ask-sug { text-align: left; border: 1px solid var(--line-2); background: #fff; border-radius: 9px; padding: 9px 11px; font-size: 12.5px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .ask-sug:hover { border-color: var(--accent); background: var(--sel); }

  /* ---------- Reader ---------- */

/* ---------- Calm layer (2026-09-29): the reference compose card, quieter ----------
   One ink accent, soft grey page, white cards, hover-to-reveal detail, 180ms ease-out. */
:root {

  --line: #e6e6e4; --line-2: #dededc; --accent: #1a1a1a; --accent-soft: #ececea; --sel: #ffffff; --unread: #1a1a1a;

<script>
const API = (p) => "api/" + p;   // relative -> works behind /service/unified-inbox/
let SOURCES = {}, MSGS = [], META = {};
let filterSrc = "needs", unreadOnly = false, query = "", sel = 0;
let DEEP = [], deepQuery = "", deepLoading = false;   // deep full-history search results
let mode = "mail";        // "mail" | "messages" | "calendar" | "luma" | "tasks"
let EVENTS = [], evSel = 0;
let calView = "week", calAnchor = new Date();  // calendar grid state
let LUMA = [], lumaSel = 0;
let TASKS = [], taskSel = 0;
let CHAT = [];  // {role, content} turns in the Ask panel
let readState = {};  // client-side read marking
let LANE = {}, WHY = {}, PSCORE = {}, PREVIEW = null;  // triage lane per message id (from /api/triage)
const detailCache = {};  // id -> fetched detail (prefetched for instant reads)
const CHAT_TTL = 45000;  // chat threads change; re-fetch cached ones after this

const el = (id) => document.getElementById(id);
function relTime(ts) {
  if (!ts) return "";
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  if (s < 604800) return Math.floor(s/86400) + "d";
  const d = new Date(ts*1000);
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function initials(name){ return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?"; }
function isRead(m){ return readState[m.id] || !m.unread; }

async function load() {
  SOURCES = await (await fetch(API("sources"))).json();
  await refreshData();
  renderPills();
  setInterval(pollStatus, 4000);
}
const _loaded = { events: false, luma: false, tasks: false };
async function refreshData() {
  const data = await (await fetch(API("messages"))).json();
  MSGS = data.messages; META = data.meta;
  await loadTriage();
  renderPills(); render(); updateStatus();       // paint the inbox immediately
  // Refresh secondary data only if it was already loaded this session; a tab
  // never visited stays unfetched until opened (keeps first load light).
  if (_loaded.events) loadEvents();
  if (_loaded.luma) loadLuma();
  if (_loaded.tasks) loadTasks();
}
async function loadTriage() {
  try {
    const t = await (await fetch(API("triage"))).json();
    LANE = {}; WHY = {}; PSCORE = {};
    for (const [lane, xs] of Object.entries(t.lanes)) for (const m of xs) { LANE[m.id] = lane; WHY[m.id] = m.why; if (m.p != null) PSCORE[m.id] = m.p; }
    PREVIEW = t.preview; renderModelStatus();
  } catch (e) { /* triage is additive; the inbox still works without it */ }
}
// Every choice is a training signal (open, dwell, done, move). See triage.py.
function signal(id, action, lane) {
  fetch(API("signal"), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, action, lane }) }).catch(() => {});
}
// AnyJev status: preview only (scores shown, lanes unchanged) until the personal head is fit.
function renderModelStatus() {
  const e = el("modelStatus"); if (!e || !PREVIEW) return;
  if (PREVIEW.anyjev_error) { e.innerHTML = `<span style="color:#c50000">AnyJev: ${esc(PREVIEW.anyjev_error)}</span>`; return; }
  e.textContent = PREVIEW.anyjev
    ? `AnyJev preview on · ${Object.keys(PSCORE).length} scored · ${PREVIEW.signals}/${PREVIEW.fit_after} choices to your model`
    : `AnyJev off · ${PREVIEW.signals} choices logged`;
}
function pChip(id) {
  const p = PSCORE[id]; if (p == null) return "";
  return `<span class="pchip" title="AnyJev: probability this needs you (preview, does not move mail yet)">AnyJev ${p.toFixed(2)}</span>`;
}
// Done: out of Needs you now and after reload (server remembers), stays greyed in All mail.
function markDone(m) {
  readState[m.id] = true; LANE[m.id] = "done"; WHY[m.id] = "done";
  signal(m.id, "done");
  const row = el("list").querySelector(".row.sel");
  const finish = () => { render(); renderPills(); if (visible()[sel]) open(false); };
  if (row && filterSrc === "needs") { row.classList.add("leaving"); setTimeout(finish, 180); } else finish();
}
function moveLane(id, lane) { LANE[id] = lane; WHY[id] = "you moved it"; signal(id, "move", lane); render(); renderPills(); }
async function loadEvents() {
  _loaded.events = true;
  try { EVENTS = (await (await fetch(API("events"))).json()).events || []; } catch(e) { EVENTS = []; }
  if (mode === "calendar") render();
}
async function loadLuma() {
  _loaded.luma = true;
  try { LUMA = (await (await fetch(API("luma"))).json()).events || []; } catch(e) { LUMA = []; }
  if (mode === "luma" || mode === "calendar") render();  // the calendar overlays Luma, so repaint it too
}
async function loadTasks() {
  _loaded.tasks = true;
  try { TASKS = (await (await fetch(API("tasks"))).json()).tasks || []; } catch(e) { TASKS = []; }
  if (mode === "tasks") render();
}
async function pollStatus() {
  // Cheap poll: fetch only the small status blob (a few hundred bytes). Re-pull
  // the full data set + re-render ONLY when the background refresh advanced --
  // avoids re-downloading the whole message list every few seconds over the
  // network tunnel, which is what made the tab feel sluggish.
  let meta;
  try { meta = await (await fetch(API("status"))).json(); } catch(e) { return; }
  const changed = meta.last_refresh !== META.last_refresh;
  META = meta;
  updateStatus();
  if (changed) await refreshData();
}
function updateStatus() {
  el("pulse").classList.toggle("on", !!META.refreshing);
  const t = META.last_refresh ? relTime(META.last_refresh) : "—";
  el("statusText").textContent = META.refreshing ? "syncing…" : `synced ${t} ago`;
}

function counts() {
  const c = {}; Object.keys(SOURCES).forEach(k=>c[k]=0);
  MSGS.forEach(m => { if (!isRead(m)) c[m.source] = (c[m.source]||0)+1; });
  return c;
}
function renderPills() {
  const c = counts();
  // Only this tab's sources; the "all" count is scoped to the tab too.
  const scopedSrcs = Object.entries(SOURCES).filter(([k]) => inScope(k));
  const total = scopedSrcs.reduce((a,[k]) => a + (c[k]||0), 0);
  const allLabel = mode === "messages" ? "All messages" : "All mail";
  const needsN = MSGS.filter(m => inScope(m.source) && LANE[m.id] === "act" && !isRead(m) && (m.ts || 0) >= Date.now() / 1000 - 21 * 86400).length;
  let html = `<div class="pill needs ${filterSrc==='needs'?'on':''}" data-src="needs">Needs you ${needsN?`<span class="n">${needsN}</span>`:''}</div>`;
  html += `<div class="pill ${filterSrc==='all'?'on':''}" data-src="all">${allLabel} ${total?`<span class="n">${total}</span>`:''}</div>`;
  html += `<div class="pill ${unreadOnly?'on':''}" data-toggle="unread">Unread</div>`;
  html += `<div class="pill sep">|</div>`;
  for (const [k,s] of scopedSrcs) {
    html += `<div class="pill ${filterSrc===k?'on':''}" data-src="${k}">
      <span class="dot" style="background:${s.color}"></span>${s.short}${c[k]?`<span class="n">${c[k]}</span>`:''}</div>`;
  }
  el("pills").innerHTML = html;
  el("pills").querySelectorAll("[data-src]").forEach(p=>p.onclick=()=>{filterSrc=p.dataset.src;sel=0;render();renderPills();});
  el("pills").querySelectorAll("[data-toggle]").forEach(p=>p.onclick=()=>{unreadOnly=!unreadOnly;sel=0;render();renderPills();});
}

// Fuzzy subsequence scorer: every query token must appear (in order) in the
// haystack; bonuses for consecutive chars and word starts. Returns -1 if no match.
function subseqScore(hay, tok) {
  let hi = 0, score = 0, streak = 0;
  for (const c of tok) {
    let found = -1;
    for (let i = hi; i < hay.length; i++) { if (hay[i] === c) { found = i; break; } }
    if (found < 0) return -1;
    if (found === hi) { streak++; score += 2 + streak; } else { streak = 0; score += 1; }
    if (found === 0 || /[\s\W_]/.test(hay[found - 1])) score += 3;
    hi = found + 1;
  }
  return score;
}
function fuzzyScore(hay, q) {
  hay = hay.toLowerCase();
  let total = 0;
  for (const tok of q.toLowerCase().trim().split(/\s+/)) {
    if (!tok) continue;
    const s = subseqScore(hay, tok);
    if (s < 0) return -1;   // every token must match somewhere
    total += s;
  }
  return total;
}

// Fuzzy on the short title (who + subject) so typos still hit; fall back to an
// exact substring match in the body so searching message text still works --
// but WITHOUT fuzzy-subsequencing long snippets (which matches almost anything).
function messageScore(m, q) {
  const fs = fuzzyScore(`${m.who} ${m.subject}`, q);
  if (fs >= 0) return fs + 100;
  const hay = `${m.who} ${m.subject} ${m.snippet}`.toLowerCase();

// Cache-aware detail fetch. Emails are immutable -> cache forever; chat
// threads change -> re-fetch after a short TTL. Concurrent calls share one
// in-flight promise so prefetch + open don't double-fetch.
function getDetail(m) {
  if (m.open_external) return Promise.resolve(null);  // deep Slack result opens out; it has no body route
  const c = detailCache[m.id];
  if (c && c._promise) return c._promise;
  const fresh = c && (m.kind === "email" || (Date.now() - c._at < CHAT_TTL));
  if (fresh) return Promise.resolve(c);
  const p = fetch(API("message/" + encodeURIComponent(m.id)))
    .then(r => r.json())
    .then(d => { if (!d || d.error) return c || null;  // server couldn't load it -> show the fallback
                 d._at = Date.now(); detailCache[m.id] = d; return d; })
    .catch(() => c || null);
  detailCache[m.id] = { _promise: p, _at: (c && c._at) || 0 };
  return p;
}

function prefetch() {
  const items = visible();
  [sel, sel + 1, sel + 2, sel - 1].forEach(i => { if (items[i]) getDetail(items[i]); });

      data-ci="${_calEv.push(it.e)-1}" title="${esc(it.e.title)}${spans?' (all-day)':''}">${esc(it.e.title)}</div>`;
  }).join("");
  const alldayGrid = `<div class="cal-corner cal-allday-label">all-day</div>${bars}`;

  const bodyH = 24*CAL_HOUR_H;
  const axisHtml = Array.from({length:24},(_,h)=>`<div class="hr" style="top:${h*CAL_HOUR_H}px">${h===0?'':((h%12)||12)+(h<12?'am':'pm')}</div>`).join("");
  const nowTop = (new Date().getHours()*60 + new Date().getMinutes())/60*CAL_HOUR_H;
  const dayCols = days.map(d => {
    const ds=d.getTime()/1000, de=ds+86400;
    const items = inRange.filter(e => !spanning(e) && e.start < de && (e.end||e.start) > ds).map(e => {
      const s=Math.max(e.start,ds), en=Math.min(e.end||e.start+1800, de);
      return {...e, _s:(s-ds)/3600, _e:Math.max((en-ds)/3600, (s-ds)/3600+0.4)};
    });
    packDay(items);
    const evHtml = items.map(e => {
      const top=e._s*CAL_HOUR_H, h=Math.max(16,(e._e-e._s)*CAL_HOUR_H-2), w=100/e._n, left=e._col*w;
      const t=new Date(e.start*1000).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
      return `<div class="cal-event" style="top:${top}px;height:${h}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px);background:${e.color}" data-ci="${_calEv.push(e)-1}">
        <div class="ce-t">${esc(e.title)}</div><div class="ce-time">${t}</div></div>`;
    }).join("");
    const nowLine = d.getTime()===today ? `<div class="cal-now" style="top:${nowTop}px;left:0;right:0"></div>` : "";
    return `<div class="cal-col" style="height:${bodyH}px">${evHtml}${nowLine}</div>`;
  }).join("");

  el("list").innerHTML = `<div class="calv">
    <div class="cal-toolbar">
      <div class="cal-nav"><button class="cal-btn" id="calToday">Today</button><button class="cal-btn" id="calPrev">‹</button><button class="cal-btn" id="calNext">›</button></div>
      <span class="cal-range">${rangeLbl}</span>
      <div class="cal-nav" style="margin-left:12px"><button class="cal-btn ${calView==='week'?'on':''}" data-cv="week">Week</button><button class="cal-btn ${calView==='3day'?'on':''}" data-cv="3day">3-day</button></div>
      <div class="cal-legend">${legendHtml}</div>
    </div>
    <div class="cal-head" style="grid-template-columns:${cols}"><div class="cal-corner"></div>${headHtml}</div>
    <div class="cal-allday" style="grid-template-columns:${cols};grid-template-rows:repeat(${laneCount}, 20px)">${alldayGrid}</div>
    <div class="cal-body" id="calBody"><div class="cal-grid" style="grid-template-columns:${cols}"><div class="cal-axis" style="height:${bodyH}px">${axisHtml}</div>${dayCols}</div></div>
  </div>`;

  el("calToday").onclick = () => { calAnchor = new Date(); render(); };
  el("calPrev").onclick = () => { calAnchor.setDate(calAnchor.getDate() - (calView==='week'?7:3)); render(); };
  el("calNext").onclick = () => { calAnchor.setDate(calAnchor.getDate() + (calView==='week'?7:3)); render(); };
  document.querySelectorAll("[data-cv]").forEach(b => b.onclick = () => { calView = b.dataset.cv; render(); });
  el("list").querySelectorAll("[data-ci]").forEach(x => {
    const ev = _calEv[+x.dataset.ci];
    x.onclick = () => { document.querySelectorAll(".cal-event.sel,.cal-chip.sel").forEach(s=>s.classList.remove("sel")); x.classList.add("sel"); showCalEvent(ev); };
    x.onmousemove = (me) => calTip(me, ev);
    x.onmouseleave = () => calTip(null, null);
  });
  const body = el("calBody"); if (body) body.scrollTop = 7*CAL_HOUR_H;  // open around 7am
}

/* ---------- Luma SF ---------- */
let lumaFilter = "all";  // all | going | pending | invited | discover
const LUMA_STATUS = {going:{label:"Going",color:"#12a150"}, pending:{label:"Pending",color:"#c9820a"}, invited:{label:"Invited",color:"#5b53e0"}, discover:{label:"Discover",color:"#9498a1"}};
function upcomingLuma(){
  const q = query.trim();
  let items = LUMA.slice();
  if (lumaFilter !== "all") items = items.filter(e => (e.status||"discover") === lumaFilter);
  if (q) items = items.map(e=>({e,s:fuzzyScore(`${e.name} ${e.location}`,q)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.e);
  return items;
}
function renderLuma(){
  const items = upcomingLuma();
  if (lumaSel >= items.length) lumaSel = Math.max(0, items.length-1);
  const list = el("list");
  // Filter pills with counts, so Carl can flip between what he's going to / pending / invited / discover.
  const counts = {}; LUMA.forEach(e => { const s=e.status||"discover"; counts[s]=(counts[s]||0)+1; });
  const pill = (k,label) => `<button class="luma-pill ${lumaFilter===k?'on':''}" data-lf="${k}">${label}${k!=="all"&&counts[k]?` <span class="n">${counts[k]}</span>`:""}</button>`;
  let pills = `<div class="luma-pills">${pill("all","All")}${["going","pending","invited","discover"].map(k=>pill(k,LUMA_STATUS[k].label)).join("")}</div>`;
  if (!items.length){ list.innerHTML = pills + `<div class="loading">No ${lumaFilter==="all"?"":lumaFilter+" "}Luma events${query?" match":""}.</div>`; bindLumaPills(); return; }
  const todayKey = dayKey(Date.now()/1000);
  let html = "", lastDay = null;
  items.forEach((e,i)=>{
    if (!query){ const dk = dayKey(e.start); if (dk !== lastDay){ html += `<div class="luma-day ${dk===todayKey?'today':''}">${dk===todayKey?'Today · ':''}${dk}</div>`; lastDay = dk; } }
    const t = e.start ? new Date(e.start*1000).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) : "";
    const cover = e.cover ? `<img class="luma-cover" src="${e.cover}" alt="">` : `<div class="luma-cover"></div>`;
    const st = LUMA_STATUS[e.status||"discover"];
    const badge = (e.status && e.status!=="discover") ? `<span class="luma-badge" style="color:${st.color};background:${st.color}1a">${st.label}</span>` : "";
    html += `<div class="luma-card ${i===lumaSel?'sel':''}" data-i="${i}">${cover}
      <div class="luma-body"><div class="luma-time">${t}${badge}</div><div class="luma-name">${esc(e.name)}</div>

  list.querySelectorAll(".luma-card").forEach(c => c.addEventListener("click", ()=>{ lumaSel = +c.dataset.i; renderLuma(); showLumaDetail(items[lumaSel]); }));
  const sc = list.querySelector(".luma-card.sel"); if (sc) sc.scrollIntoView({block:"nearest"});
}
function bindLumaPills(){ document.querySelectorAll(".luma-pill").forEach(p => p.onclick = ()=>{ lumaFilter=p.dataset.lf; lumaSel=0; renderLuma(); }); }
function moveLuma(d){ const items=upcomingLuma(); if(!items.length)return; lumaSel=Math.max(0,Math.min(items.length-1,lumaSel+d)); renderLuma(); showLumaDetail(items[lumaSel]); }

/* ---------- Obsidian graph (force-directed canvas in the Tasks panel) ---------- */
let GRAPH = null, _graphAnim = null;
async function showTaskGraph(){
  const reader = el("reader"); reader.classList.remove("empty");
  if (!reader.querySelector(".graph-wrap")){
    reader.innerHTML = `<div class="graph-wrap"><div class="graph-head">Vault graph · <b id="graphCount">…</b><a class="graph-rebuild" id="graphRebuild">rebuild</a><span class="graph-hint">drag a node · drag canvas to pan · scroll to zoom</span></div>
      <canvas id="graphCanvas"></canvas><div class="graph-tip" id="graphTip"></div>
      <div class="graph-building" id="graphBuilding">Building your vault graph… (first time reads every note)</div></div>`;
    el("graphRebuild").onclick = rebuildGraph;
  }
  if (!GRAPH){
    try {
      const g = await (await fetch(API("graph"))).json();
      if (g.building || !g.nodes.length){ setTimeout(()=>{ if(mode==="tasks"){ GRAPH=null; showTaskGraph(); } }, 4000); return; }
      GRAPH = g;
    } catch(e){ return; }
  }
  const bld = el("graphBuilding"); if (bld) bld.style.display = "none";
  const cnt = el("graphCount"); if (cnt) cnt.textContent = `${GRAPH.nodes.length} notes · ${GRAPH.links.length} links`;
  layoutAndDrawGraph();
}
// Force a fresh crawl of the vault, then swap in the rebuilt graph. The crawl is
// slow (~60s), so show a subtle building state and poll the cached endpoint until
// the server's building flag clears.
async function rebuildGraph(){
  const btn = el("graphRebuild");
  if (!btn || btn.classList.contains("busy")) return;   // already rebuilding
  btn.classList.add("busy"); btn.textContent = "building…";
  try { await fetch(API("graph/rebuild"), { method: "POST" }); } catch(e){}
  let tries = 0;
  const done = () => { btn.classList.remove("busy"); btn.textContent = "rebuild"; };
  const poll = async () => {
    if (mode !== "tasks"){ done(); return; }   // user navigated away
    let g;
    try { g = await (await fetch(API("graph"))).json(); } catch(e){ done(); return; }
    if (g.building && ++tries < 60){ setTimeout(poll, 3000); return; }   // ~3min cap
    done();
    if (g.nodes && g.nodes.length){
      GRAPH = g;   // fresh nodes (no positions) -> layoutAndDrawGraph re-lays out
      const cnt = el("graphCount"); if (cnt) cnt.textContent = `${GRAPH.nodes.length} notes · ${GRAPH.links.length} links`;
      layoutAndDrawGraph();
    }
  };
  setTimeout(poll, 1500);
}
function layoutAndDrawGraph(){
  const canvas = el("graphCanvas"); if (!canvas || !GRAPH) return;
  // Drop any window listeners from a previous redraw so they don't accumulate
  // (the canvas element persists across selection changes / rebuilds).
  if (canvas._gm) window.removeEventListener("mousemove", canvas._gm);
  if (canvas._gu) window.removeEventListener("mouseup", canvas._gu);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext("2d");
  const N = GRAPH.nodes, L = GRAPH.links;
  const idx = {}; N.forEach((n,i)=>{ idx[n.id]=i; if(n.x===undefined){ const a=Math.random()*6.283, r=Math.min(W,H)*0.35*Math.sqrt(Math.random()); n.x=W/2+r*Math.cos(a); n.y=H/2+r*Math.sin(a); n.vx=0; n.vy=0; } });
  const edges = L.map(e=>[idx[e.source],idx[e.target]]).filter(([a,b])=>a!==undefined&&b!==undefined);
  const nodeRadius = n => Math.max(2.2, Math.min(11, 2.2+Math.sqrt(n.val)*1.3));
  // View transform (pan/zoom), persisted on GRAPH so it survives redraws but
  // resets when the vault is rebuilt (a fresh GRAPH object). screen = ox + scale*world.
  const view = GRAPH._view || (GRAPH._view = {ox:0, oy:0, scale:1});
  const toWorld = (sx,sy) => [(sx-view.ox)/view.scale, (sy-view.oy)/view.scale];

  // alpha cools the simulation to rest; re-heated on drag so the layout reacts.
  let alpha = GRAPH._settled ? 0.02 : 0.4;
  let drag = null, panning = null;
  function step(){
    for (let i=0;i<N.length;i++){ const a=N[i]; for (let j=i+1;j<N.length;j++){ const b=N[j];
      let dx=a.x-b.x, dy=a.y-b.y; let d2=dx*dx+dy*dy+0.01; if (d2>90000) continue;
      const f=280/d2; dx*=f; dy*=f; a.vx+=dx; a.vy+=dy; b.vx-=dx; b.vy-=dy; } }
    for (const [a,b] of edges){ const na=N[a], nb=N[b]; let dx=nb.x-na.x, dy=nb.y-na.y; const d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-42)*0.015; dx=dx/d*f; dy=dy/d*f; na.vx+=dx; na.vy+=dy; nb.vx-=dx; nb.vy-=dy; }
    for (const n of N){
      if (n===drag) { n.vx=0; n.vy=0; continue; }  // dragged node follows the cursor, not physics
      n.vx+=(W/2-n.x)*0.002; n.vy+=(H/2-n.y)*0.002;
      n.x+=Math.max(-8,Math.min(8,n.vx))*alpha*2.5; n.y+=Math.max(-8,Math.min(8,n.vy))*alpha*2.5; n.vx*=0.82; n.vy*=0.82;
    }
  }
  // Highlight the note matching the selected task (by name prefix).
  const items = visibleTasks(); const selText = (items[taskSel]||{}).text || "";
  const selNode = selText ? N.find(n => selText.toLowerCase().startsWith(n.label.toLowerCase().slice(0,18)) || n.label.toLowerCase().startsWith(selText.toLowerCase().slice(0,18))) : null;
  let hoverNode = null;
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    ctx.translate(view.ox, view.oy); ctx.scale(view.scale, view.scale);
    ctx.strokeStyle="rgba(120,130,150,0.18)"; ctx.lineWidth=0.6/view.scale;
    for (const [a,b] of edges){ ctx.beginPath(); ctx.moveTo(N[a].x,N[a].y); ctx.lineTo(N[b].x,N[b].y); ctx.stroke(); }
    for (const n of N){ const r=nodeRadius(n);
      ctx.beginPath(); ctx.arc(n.x,n.y,r,0,6.283);
      ctx.fillStyle = (n===selNode)?"#f2b45f":(n===hoverNode)?"#a5b4fc":(n.val>20?"#5b53e0":n.val>6?"#818cf8":"#4a5568"); ctx.fill();
      if (n.val>18 || n===selNode || n===hoverNode){ ctx.fillStyle="rgba(233,231,225,0.9)"; ctx.font=`${10/view.scale}px Inter, sans-serif`; ctx.fillText(n.label.slice(0,22), n.x+r+2, n.y+3); }
    }
  }
  // A single always-on loop: cools the sim to rest, always redraws so pan/zoom/
  // drag stay live. Stops when the graph leaves the DOM or Tasks is left.
  cancelAnimationFrame(_graphAnim);
  (function animate(){
    if (!document.body.contains(canvas) || mode!=="tasks") { return; }
    if (alpha > 0.008) { step(); alpha *= 0.985; } else if (!drag) { GRAPH._settled = true; }
    draw();
    _graphAnim = requestAnimationFrame(animate);
  })();

  const tip = el("graphTip");
  const nodeAt = (sx,sy) => { const [wx,wy]=toWorld(sx,sy); let hit=null, best=Infinity;
    for (const n of N){ const r=nodeRadius(n)+4; const d=(n.x-wx)**2+(n.y-wy)**2; if(d<r*r && d<best){best=d;hit=n;} } return hit; };
  canvas.onmousedown = (ev)=>{ const rect=canvas.getBoundingClientRect(); const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
    const n = nodeAt(mx,my);
    if (n){ drag=n; alpha=Math.max(alpha,0.3); GRAPH._settled=false; canvas.style.cursor="grabbing"; }
    else { panning={x:ev.clientX, y:ev.clientY, ox:view.ox, oy:view.oy}; canvas.style.cursor="grabbing"; }
    ev.preventDefault(); };
  window.addEventListener("mousemove", canvas._gm = (ev)=>{
    const rect=canvas.getBoundingClientRect(); const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
    if (drag){ const [wx,wy]=toWorld(mx,my); drag.x=wx; drag.y=wy; alpha=Math.max(alpha,0.2); return; }
    if (panning){ view.ox=panning.ox+(ev.clientX-panning.x); view.oy=panning.oy+(ev.clientY-panning.y); return; }
    if (mx<0||my<0||mx>W||my>H){ hoverNode=null; tip.style.display="none"; return; }
    hoverNode = nodeAt(mx,my); canvas.style.cursor = hoverNode ? "pointer" : "grab";
    if (hoverNode){ tip.style.display="block"; tip.style.left=Math.min(mx+12,W-tip.offsetWidth-8)+"px"; tip.style.top=(my+12)+"px"; tip.textContent=`${hoverNode.label}  ·  ${hoverNode.val} links`; }
    else tip.style.display="none"; });
  window.addEventListener("mouseup", canvas._gu = ()=>{ if(drag||panning){ drag=null; panning=null; canvas.style.cursor="grab"; } });
  canvas.onwheel = (ev)=>{ ev.preventDefault(); const rect=canvas.getBoundingClientRect(); const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
    const [wx,wy]=toWorld(mx,my); const factor=Math.exp(-ev.deltaY*0.0015);
    view.scale=Math.max(0.2, Math.min(5, view.scale*factor));
    view.ox=mx-wx*view.scale; view.oy=my-wy*view.scale; };  // keep the point under the cursor fixed
}

/* ---------- Floating Ask agent ---------- */
const CHAT_SUGGESTIONS = [
  "What are my top priorities today?",
  "Summarize my unread Minerva email.",
  "Any GitHub PRs waiting on my review?",
  "What should I not miss this week?",
];
function openAsk(){ el("askFloat").classList.add("on"); el("askFab").classList.add("hidden"); renderChatMsgs(); setTimeout(()=>{ const t=el("chatInput"); if(t) t.focus(); },0); }
function closeAsk(){ el("askFloat").classList.remove("on"); el("askFab").classList.remove("hidden"); }
function toggleAsk(){ el("askFloat").classList.contains("on") ? closeAsk() : openAsk(); }
function renderChatMsgs(){
  const m = el("chatMsgs"); if (!m) return;
  if (!CHAT.length){
    m.innerHTML = `<div class="chat-empty">Ask me anything, or tell me to look something up — I can read your email, chats, GitHub, calendar and tasks live to help you plan and draft. (I stay read-only; I won't send anything.)</div>
      <div class="ask-suggest">${CHAT_SUGGESTIONS.map(q=>`<button class="ask-sug" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
    m.querySelectorAll(".ask-sug").forEach(b=>b.onclick=()=>{ el("chatInput").value=b.dataset.q; sendChat(); });
    return;
  }
  m.innerHTML = CHAT.map(c => {
    const body = c.role === "assistant" && !c._thinking
      ? esc(c.content).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      : esc(c.content);
    return `<div class="chat-b ${c.role}${c._thinking?' thinking':''}">${body}</div>`;
  }).join("");
  m.scrollTop = m.scrollHeight;
}
async function sendChat(){
  const ta = el("chatInput"); if (!ta) return;
  const q = ta.value.trim(); if (!q) return;
  ta.value = ""; ta.style.height = "auto";
  const history = CHAT.filter(c => !c._thinking).map(c => ({role: c.role, content: c.content}));
  CHAT.push({role: "user", content: q});
  const bubble = {role: "assistant", content: "Working on it… (reading your accounts live)", _thinking: true};
  CHAT.push(bubble);
  renderChatMsgs();
  if (el("chatSend")) el("chatSend").disabled = true;
  try {
    const resp = await fetch(API("agent-stream"), {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question: q, history})});
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let acc = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      acc += dec.decode(value, {stream: true});
      if (acc.trim()) { bubble.content = acc; bubble._thinking = false; renderChatMsgs(); }  // first token -> start typing
    }
    bubble.content = acc.trim() || "(no answer)"; bubble._thinking = false;
  } catch(e){ bubble.content = "Sorry, something went wrong reaching the assistant."; bubble._thinking = false; }
  if (el("chatSend")) el("chatSend").disabled = false;
  renderChatMsgs();
  if (el("chatInput")) el("chatInput").focus();
}
el("askFab").onclick = openAsk;
el("askClose").onclick = closeAsk;
el("chatSend").onclick = sendChat;
(function(){ const ta = el("chatInput");
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); } });
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; });
})();

/* ---------- Keyboard ---------- */
// Moving selection previews the message in the reader immediately (no Enter
// needed) but does NOT mark it read -- Enter/click/`e` do that.
function move(d){ const items=visible(); if(!items.length)return; sel=Math.max(0,Math.min(items.length-1,sel+d)); open(false); }

// The inbox runs inside a workspace iframe; single-key shortcuts only reach us
// if the iframe holds focus. Grab it on load and whenever the pointer enters.
function grabFocus(){ try { window.focus(); if (document.activeElement !== el("search")) document.body.focus(); } catch(e){} }
window.addEventListener("load", grabFocus);
document.addEventListener("mouseenter", grabFocus);
document.querySelector(".main").addEventListener("mousemove", grabFocus, {passive:true});

document.addEventListener("keydown", (e) => {
  if (el("paletteWrap").classList.contains("on")) return paletteKeys(e);
  // Global shortcuts work everywhere, including from the search box.
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k") { e.preventDefault(); openPalette(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="f") { e.preventDefault(); el("search").focus(); el("search").select(); return; }
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="j") { e.preventDefault(); toggleAsk(); return; }
  if (el("chatInput") && document.activeElement === el("chatInput")) {
    if (e.key === "Escape") closeAsk();
    return;  // typing in the Ask panel
  }
  const inSearch = document.activeElement === el("search");
  if (inSearch) {
    if (e.key === "Escape") { el("search").blur(); grabFocus(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;  // let real browser shortcuts through
  if (e.key === "c") { setMode(mode==="calendar"?"mail":"calendar"); return; }  // quick toggle
  if (e.key === "m") { setMode(mode==="messages"?"mail":"messages"); return; }  // toggle mail/messages
  if (mode === "calendar") {
    if (e.key === "ArrowRight" || e.key === "j" || e.key === "n") { e.preventDefault(); calAnchor.setDate(calAnchor.getDate() + (calView==='week'?7:3)); render(); }
    else if (e.key === "ArrowLeft" || e.key === "k" || e.key === "p") { e.preventDefault(); calAnchor.setDate(calAnchor.getDate() - (calView==='week'?7:3)); render(); }
    else if (e.key === "t") { calAnchor = new Date(); render(); }
    else if (e.key === "w") { calView = "week"; render(); }
    else if (e.key === "d") { calView = "3day"; render(); }
    return;
  }
  if (mode === "luma") {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveLuma(1); }
    else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveLuma(-1); }
    else if (e.key === "Enter" || e.key === "o") { e.preventDefault(); openLuma(); }
    else if (e.key === "/") { e.preventDefault(); el("search").focus(); }
    else if (e.key === "Escape") { query=""; el("search").value=""; lumaSel=0; render(); }
    return;
  }
  if (mode === "tasks") {
    if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); moveTask(1); }
    else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); moveTask(-1); }
    else if (e.key === "/") { e.preventDefault(); el("search").focus(); }
    else if (e.key === "Escape") { query=""; el("search").value=""; taskSel=0; render(); }
    return;
  }
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); move(1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (e.key === "Enter" || e.key === "o") { e.preventDefault(); open(true); }
  else if (e.key === "/") { e.preventDefault(); el("search").focus(); }
  else if (e.key === "u") { unreadOnly=!unreadOnly; sel=0; render(); renderPills(); }
  else if (e.key === "r") { doRefresh(); }
  else if (e.key === "e") { const m=visible()[sel]; if(m) markDone(m); }
  else if (e.key === "x") { const m=visible()[sel]; if(m) moveLane(m.id, "later"); }
  else if (e.key === "n") { const m=visible()[sel]; if(m) moveLane(m.id, "act"); }
  else if (e.key === "Escape") { filterSrc="all"; unreadOnly=false; query=""; el("search").value=""; sel=0; render(); renderPills(); }
}, true);
el("search").addEventListener("input", (e)=>{ query=e.target.value; sel=0; evSel=0; lumaSel=0; taskSel=0; if (query.trim()!==deepQuery){ DEEP=[]; deepQuery=""; } render(); });
el("refreshBtn").onclick = doRefresh;
el("cmdBtn").onclick = openPalette;
async function doRefresh(){ el("pulse").classList.add("on"); el("statusText").textContent="syncing…"; await fetch(API("refresh"),{method:"POST"}); setTimeout(pollStatus, 1500); }

/* ---------- Command palette ---------- */
let palSel = 0, palOpts = [];
function modeForSource(source){ return (SOURCES[source]||{}).group === "Chat" ? "messages" : "mail"; }
function jumpToMessage(id){
  const m = MSGS.find(x => x.id === id);
  setMode(m ? modeForSource(m.source) : "mail");
  filterSrc = "all"; unreadOnly = false; query = ""; el("search").value = "";
  const idx = visible().findIndex(x => x.id === id);
  if (idx >= 0) { sel = idx; open(true); } else { render(); }
}
function buildOpts(){
  const cmds = [
    {label:"Go to Mail", act:()=>setMode("mail"), color:"#16161a"},
    {label:"Go to Messages", act:()=>setMode("messages"), color:"#9333ea", hint:"m"},
    {label:"Go to Calendar", act:()=>setMode("calendar"), color:"#16161a", hint:"c"},
    {label:"Go to Luma SF", act:()=>setMode("luma"), color:"#e0533d"},
    {label:"Go to Tasks", act:()=>setMode("tasks"), color:"#12a150"},
    {label:"Ask the inbox agent", act:()=>openAsk(), color:"#5b53e0", hint:"⌘J"},
    {label:"Unread only", act:()=>{unreadOnly=true;render();renderPills();}, color:"#5b53e0", hint:"u"},
    {label:"Refresh now", act:doRefresh, color:"#12a150", hint:"r"},
  ];
  const srcs = Object.entries(SOURCES).map(([k,s])=>({label:"Account: "+s.label, act:()=>{setMode(modeForSource(k));filterSrc=k;render();renderPills();}, color:s.color, hint:s.short}));
  // Discord-style: jump straight to any conversation / channel.
  const convos = MSGS.filter(m=>m.kind==="chat").map(m=>{
    const s = SOURCES[m.source];
    const ctx = m.addr && m.addr.includes(" · ") ? m.addr.split(" · ")[0] : s.provider;
    return {label:`${m.who}  ·  ${ctx}`, act:()=>jumpToMessage(m.id), color:s.color, hint:s.short};
  });
  return cmds.concat(srcs, convos);
}
function openPalette(){ palOpts=buildOpts(); palSel=0; el("paletteInput").value=""; renderPalette(""); el("paletteWrap").classList.add("on"); setTimeout(()=>el("paletteInput").focus(),0); }
function closePalette(){ el("paletteWrap").classList.remove("on"); }
function renderPalette(q){
  let opts;
  if (q.trim()) {
    opts = palOpts.map(o=>({o, s:fuzzyScore(o.label, q)})).filter(x=>x.s>=0)
                  .sort((a,b)=>b.s-a.s).map(x=>x.o).slice(0,50);
  } else {
    opts = palOpts.slice(0, 50);
  }
  el("paletteOpts").innerHTML = opts.map((o,i)=>`<div class="opt ${i===palSel?'on':''}" data-i="${i}"><span class="dot" style="background:${o.color}"></span>${esc(o.label)}${o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`).join("");
  window._palFiltered = opts;
  el("paletteOpts").querySelectorAll(".opt").forEach(d=>d.onclick=()=>runOpt(+d.dataset.i));
}
function runOpt(i){ const o=window._palFiltered[i]; if(!o)return; closePalette(); o.act(); sel=0; render(); renderPills(); }
el("paletteInput").addEventListener("input", e=>{ palSel=0; renderPalette(e.target.value); });
function paletteKeys(e){
  if (e.key==="Escape"){ closePalette(); }
  else if (e.key==="ArrowDown"){ e.preventDefault(); palSel=Math.min((window._palFiltered.length||1)-1,palSel+1); renderPalette(el("paletteInput").value); }
  else if (e.key==="ArrowUp"){ e.preventDefault(); palSel=Math.max(0,palSel-1); renderPalette(el("paletteInput").value); }
  else if (e.key==="Enter"){ e.preventDefault(); runOpt(palSel); }
}
el("paletteWrap").onclick = (e)=>{ if(e.target===el("paletteWrap")) closePalette(); };

load();
</script>
